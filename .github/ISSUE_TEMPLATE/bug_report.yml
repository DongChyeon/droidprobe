name: Bug report
description: The CLI, SDK or dashboard behaves differently from the docs.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - CLI (probe)
        - Dashboard (probe ui)
        - probe-core
        - probe-okhttp
        - probe-lifecycle
        - probe-hilt
        - Wire protocol
        - Docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact `probe` commands and app setup. Use the sample app if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
      description: stdout/stderr and `echo $?`. Recorded traffic is not masked in bodies, so redact secrets.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - probe --version:
        - SDK version:
        - Host OS:
        - Device / emulator and API level:
    validations:
      required: true
